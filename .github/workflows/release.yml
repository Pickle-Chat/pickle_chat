# Publishing. `ci.yml` remains the per-push gate; nothing here re-runs it.
#
# Two triggers, doing different amounts of work:
#
#   * a `v*` tag  — desktop installers, a server image, and a GitHub Release
#   * push to main — the `:edge` server image only, so self-hosters can track
#                    the branch without waiting for a tag
#
# Artifacts are unsigned. They carry a SHA256SUMS file and a build provenance
# attestation instead, which ties a binary to the workflow run that produced it
# without certificates or annual fees.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # One place decides what this run is, so no other job repeats the tag test.
  plan:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
          fi

          # Registry references must be lowercase; a GitHub owner need not be,
          # and ours is not. Interpolating github.repository_owner directly
          # produced `ghcr.io/Pickle-Chat/pickle-server`, which buildx rejects
          # outright — so every push to main failed before it built anything.
          #
          # `tr` rather than bash's ${var,,} so this does not depend on the
          # runner shell being bash 4+.
          owner=$(printf %s "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=${owner}/pickle-server" >> "$GITHUB_OUTPUT"

  # Built natively per architecture rather than under QEMU. This compiles C for
  # both ring and SQLite, which emulation makes roughly ten times slower.
  image:
    needs: plan
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # No secret to manage: the token GitHub already provides can write
          # packages, given the `packages: write` permission above.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture pushes by digest; the manifest below joins them.
      # Pushing tags from both would leave whichever finished last as the
      # winner rather than producing a multi-arch image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      # The digest is recorded as a filename so the manifest job can rebuild the
      # image references without knowing which architectures ran. Stripping the
      # `sha256:` prefix has to happen in bash — Actions expressions have no
      # parameter expansion, so doing it inline silently produces nonsense.
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tagged build gets its version and `latest`; main gets `edge` only, so
      # pulling `latest` never lands on an untagged commit.
      - name: Create manifest
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.is_release }}" == "true" ]]; then
            TAGS=(--tag "${REGISTRY}/${IMAGE}:${{ needs.plan.outputs.version }}" --tag "${REGISTRY}/${IMAGE}:latest")
          else
            TAGS=(--tag "${REGISTRY}/${IMAGE}:edge")
          fi
          cd /tmp/digests
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

  # Only for tags. `main` publishes an image and nothing else.
  desktop:
    needs: plan
    if: needs.plan.outputs.is_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux
            # Tauri has no pacman backend, so Arch is packaged separately.
            args: --bundles deb
          - runner: macos-14
            name: macos
            # One universal binary rather than separate Intel and Apple Silicon
            # downloads, which people pick wrongly.
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `universal-apple-darwin` links both architectures, so both std
          # libraries have to be present.
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      # Must precede the Rust build: generate_context! embeds the built
      # frontend, so the Tauri crate does not compile without dist/.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build installers
        working-directory: apps/desktop
        run: bun run tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  server-binaries:
    needs: plan
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No system packages: the server needs neither audio nor a window, and
      # links only libc, libm and libgcc_s.
      - run: cargo build --release -p pickle-server

      - run: |
          install -Dm755 target/release/pickle-server \
            "dist/pickle-server-${{ needs.plan.outputs.version }}-x86_64-linux"

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, desktop, server-binaries]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name 'pickle-server-*' \) \
            -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Ties every artifact to this workflow run and this commit. It is what
      # replaces code signing here: not a claim that the binary is safe, but a
      # verifiable claim about where it came from.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Server

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.version }}
            ```

            Compose examples for SQLite and Postgres are in
            [`examples/compose`](https://github.com/${{ github.repository }}/tree/main/examples/compose).
            Publish the port as **UDP** — Pickle speaks QUIC — and back up the
            data volume: it holds the server identity that clients pin.

            ## Desktop

            **macOS builds are unsigned**, so Gatekeeper quarantines them and
            reports the app as damaged. It is not. Clear the attribute after
            copying it to Applications:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Pickle.app
            ```

            Arch users can build from
            [`packaging/PKGBUILD`](https://github.com/${{ github.repository }}/tree/main/packaging).

            ## Verifying a download

            ```bash
            sha256sum -c SHA256SUMS
            gh attestation verify <file> --repo ${{ github.repository }}
            ```
