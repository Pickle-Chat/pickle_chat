[package]
name = "pickle-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pickle desktop client."

[lib]
name = "pickle_desktop"
# Tauri needs the mobile-capable crate types even on desktop-only builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pickle-identity.workspace = true
pickle-proto.workspace = true
pickle-client.workspace = true
pickle-audio.workspace = true

tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
